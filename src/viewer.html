<html lang="en">

            <aside class="side" id="sidebar" aria-label="Save and filters">

                    <div class="brand"><span class="mark">✦</span>Order of the Sinking Star</div>
                    <div class="btns">
                        <button class="primary" id="openDir">Open save folder</button
                        ><input id="dirInput" type="file" webkitdirectory multiple hidden />

                    <div id="sideCamp"></div>
                </div>
                <div id="sidePanels"></div>
                <div class="sidefoot">
                    <a
                        class="gh"
                        href="https://github.com/xPaw/order-of-the-sinking-cost"

            </aside>

            <main id="main"></main>
            <aside id="results" aria-label="Levels"></aside>
        </div>
